
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chess Arena</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#101827,#243b55);color:#f8fafc;font-family:Arial,sans-serif;display:flex;justify-content:center;padding:24px}
.app{width:100%;max-width:760px}
header{text-align:center;margin-bottom:22px}
h1{margin:0 0 8px;font-size:clamp(27px,5vw,40px)}
header p{color:#cbd5e1;margin:0}
.panel{background:#fff;color:#172033;border-radius:18px;padding:20px;box-shadow:0 18px 50px #0004}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
select,button{font:inherit;border:0;border-radius:9px;padding:10px 13px}
select{background:#eef2ff;color:#172033}
button{cursor:pointer;font-weight:bold}
.primary{background:#4f46e5;color:white}
.secondary{background:#e2e8f0;color:#172033}
#status{background:#f1f5f9;padding:12px;border-radius:10px;margin:0 0 14px;font-weight:bold}
.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border:4px solid #243b55;border-radius:5px;overflow:hidden}
.square{display:flex;align-items:center;justify-content:center;position:relative;aspect-ratio:1;border-radius:0;padding:0;font-size:clamp(25px,6.5vw,54px);line-height:1}
.light{background:#f0d9b5}
.dark{background:#769656}
.square.selected{box-shadow:inset 0 0 0 4px #facc15}
.square.target::after{content:"";position:absolute;width:24%;height:24%;border-radius:50%;background:#1f293780}
.square.last{background:#cdd16a}
.pieces{font-family:"Segoe UI Symbol","DejaVu Sans",serif;pointer-events:none;z-index:1}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.info div{background:#f1f5f9;border-radius:10px;padding:12px;font-size:14px}
#history{max-height:115px;overflow:auto;line-height:1.8;color:#475569;word-break:break-word}
.actions{display:flex;gap:10px;margin-top:14px}
.actions button{flex:1}
footer{text-align:center;color:#cbd5e1;font-size:12px;margin-top:16px}
@media(max-width:440px){body{padding:12px}.panel{padding:12px}.info{grid-template-columns:1fr}.top{align-items:stretch}.top select{flex:1}}
</style>
</head>
<body>
<main class="app">
<header>
<h1>♟ AI Chess Arena</h1>
<p>Challenge the computer. Think strategically. Play to win.</p>
</header>
<section class="panel">
<div class="top">
<strong>🤖 Computer opponent</strong>
<select id="level" aria-label="AI difficulty">
<option value="1">Easy</option>
<option value="5" selected>Medium</option>
<option value="10">Hard</option>
</select>
</div>
<p id="status" role="status">Your turn — White moves first.</p>
<div id="board" class="board" aria-label="Chessboard"></div>
<div class="info">
<div><strong>♙ You play</strong><p>White pieces</p></div>
<div><strong>♟ Computer</strong><p>Black pieces</p></div>
</div>
<div class="info">
<div><strong>Moves played</strong><p id="moveCount">0</p></div>
<div><strong>Move history</strong><p id="history">No moves yet</p></div>
</div>
<div class="actions">
<button class="primary" id="restart">↻ New game</button>
<button class="secondary" id="undo">↶ Undo move</button>
</div>
</section>
<footer>AI Chess Arena · Built with HTML, CSS and JavaScript</footer>
</main>

<script>
const game = new Chess();
const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");
const historyEl = document.getElementById("history");
const countEl = document.getElementById("moveCount");
const levelEl = document.getElementById("level");

const symbols = {
 w:{k:"♔",q:"♕",r:"♖",b:"♗",n:"♘",p:"♙"},
 b:{k:"♚",q:"♛",r:"♜",b:"♝",n:"♞",p:"♟"}
};
let selected = null;
let targets = [];
let lastMove = null;
let thinking = false;

function renderBoard(){
 boardEl.innerHTML = "";
 const files = ["a","b","c","d","e","f","g","h"];
 for(let r=0;r<8;r++){
  for(let c=0;c<8;c++){
   const squareName = files[c] + (8-r);
   const piece = game.get(squareName);
   const btn = document.createElement("button");
   btn.className = "square " + ((r+c)%2===0?"light":"dark");
   btn.setAttribute("aria-label",squareName+(piece? " "+piece.color+" "+piece.type:""));
   if(selected===squareName) btn.classList.add("selected");
   if(targets.includes(squareName)) btn.classList.add("target");
   if(lastMove && (lastMove.from===squareName||lastMove.to===squareName)) btn.classList.add("last");
   if(piece){
    const span = document.createElement("span");
    span.className = "pieces";
    span.textContent = symbols[piece.color][piece.type];
    btn.appendChild(span);
   }
   btn.addEventListener("click",()=>clickSquare(squareName));
   boardEl.appendChild(btn);
  }
 }
 updateInfo();
}

function updateInfo(){
 const moves = game.history();
 countEl.textContent = moves.length;
 historyEl.textContent = moves.length ? moves.join(" ") : "No moves yet";
 if(game.game_over()){
  thinking = false;
  if(game.in_checkmate()){
   statusEl.textContent = game.turn()==="w" ? "Checkmate — Computer wins!" : "Checkmate — You win!";
  }else if(game.in_draw()){
   statusEl.textContent = "Draw! The game is over.";
  }else{
   statusEl.textContent = "Game over.";
  }
 }else if(thinking){
  statusEl.textContent = "Computer is thinking...";
 }else if(game.in_check()){
  statusEl.textContent = game.turn()==="w" ? "Your king is in check!" : "Computer is in check!";
 }else{
  statusEl.textContent = game.turn()==="w" ? "Your turn — White to move." : "Computer's turn.";
 }
}

function clickSquare(sq){
 if(thinking || game.game_over() || game.turn()!=="w") return;
 const piece = game.get(sq);
 if(selected && targets.includes(sq)){
  const move = game.move({from:selected,to:sq,promotion:"q"});
  selected=null; targets=[];
  if(move){
   lastMove={from:move.from,to:move.to};
   renderBoard();
   if(!game.game_over()) computerMove();
  }else renderBoard();
  return;
 }
 if(piece && piece.color==="w"){
  selected=sq;
  targets=game.moves({square:sq,verbose:true}).map(m=>m.to);
 }else{
  selected=null;targets=[];
 }
 renderBoard();
}

function computerMove(){
 if(game.game_over()) return;
 thinking=true; updateInfo();
 // Use a real chess engine in the browser.
 const engine = new Worker("https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js");
 let finished=false;
 const finish = (move)=>{
  if(finished)return;
  finished=true;
  engine.terminate();
  thinking=false;
  if(move && !game.game_over()){
   const result=game.move(move);
   if(result) lastMove={from:result.from,to:result.to};
  }
  selected=null;targets=[];
  renderBoard();
 };
 engine.onerror=()=>{
  // A legal fallback keeps the game playable if the engine cannot load.
  const legal=game.moves({verbose:true});
  if(legal.length) finish(legal[Math.floor(Math.random()*legal.length)].san);
  else {thinking=false;renderBoard();}
 };
 engine.onmessage=(event)=>{
  const line=String(event.data);
  if(line.startsWith("bestmove")){
   const uci=line.split(" ")[1];
   if(uci && uci!=="(none)"){
    finish({from:uci.slice(0,2),to:uci.slice(2,4),promotion:uci[4]||"q"});
   }else finish(null);
  }
 };
 engine.postMessage("uci");
 engine.postMessage("ucinewgame");
 engine.postMessage("position fen "+game.fen());
 engine.postMessage("go depth "+levelEl.value);
 // Prevent a failed engine from leaving the board locked.
 setTimeout(()=>{
  if(!finished){
   const legal=game.moves({verbose:true});
   if(legal.length) finish(legal[Math.floor(Math.random()*legal.length)].san);
   else finish(null);
  }
 },5000);
}

document.getElementById("restart").addEventListener("click",()=>{
 game.reset();selected=null;targets=[];lastMove=null;thinking=false;renderBoard();
});
document.getElementById("undo").addEventListener("click",()=>{
 if(thinking)return;
 game.undo();game.undo();
 selected=null;targets=[];lastMove=null;renderBoard();
});
renderBoard();
</script>
</body>
</html>
